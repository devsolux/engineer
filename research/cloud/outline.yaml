# Cloud platform knowledge research for engineer
# Generated: 2026-08-29 · engineer research (outline) + web supplement
# Scope: provider-specific deploy/identity/data/network/cost guidance that deploy-ops.md and
#        infra-security.md only gesture at: AWS, GCP, Vercel, and the edge/PaaS tier
#        (Cloudflare, Fly, Railway, Render, Netlify, Azure-minimal), plus IaC and multi-cloud glue.
# Window: 2025-01 → 2026-08

meta:
  project: engineer-cloud-knowledge
  skill: engineer
  mode: research-deep
  generated: 2026-08-29
  scope_window: 2025-01 → 2026-08
  batch_size: 4
  items_per_agent: 4
  output_dir: ./results
  deep_md_dir: ./deep
  report_path: ./report.md
  skill_targets:
    aws: ./references/cloud-aws.md
    gcp: ./references/cloud-gcp.md
    vercel: ./references/cloud-vercel.md
    platforms: ./references/cloud-platforms-iac.md
  constraints:
    - opinionated greenfield defaults for a TS/Next + Python-services + Supabase stack; not a provider catalog
    - identity first: OIDC/workload identity from GitHub Actions and between services; no long-lived keys in CI
    - every quota, limit, price, and version pin carries as_of 2026-08-29 and a primary URL; estimates marked [uncertain]
    - no account ids, project ids, hostnames, or tokens in examples — placeholders only (example, my-app, 123456789012)
    - feed machine-checkable scan signals (what engineer-scan / check-oss-leaks should flag) into the module
    - cost guardrails are a required output (budgets, alerts, egress traps, free-tier cliffs)

