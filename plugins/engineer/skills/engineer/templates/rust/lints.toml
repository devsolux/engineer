# engineer Rust lint baseline — the machine-checkable half of references/rust-idioms.md.
#
# Paste the tables below into Cargo.toml. In a workspace, write them as
# [workspace.lints.rust] / [workspace.lints.clippy] in the root manifest and add
#     [lints]
#     workspace = true
# to every member (Cargo 1.74+). Every level is "warn"; CI makes it binding with
#     cargo clippy --all-targets --all-features -- -D warnings
# Silence one item with a reason, which the table below requires:
#     #[expect(clippy::unwrap_used, reason = "literal regex always compiles")]
# The two suppression lints need `rust-version = "1.81"` or later in [package].
# Lines marked [lib] fit libraries; applications may drop them.
# scripts/test-rust-lints.sh proves that every lint in this file fires.

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"          # each unsafe operation needs its own unsafe block
missing_debug_implementations = "warn"   # every public type implements Debug
missing_docs = "warn"                    # [lib] every public item is documented
unreachable_pub = "warn"                 # pub items that are not actually exported
rust_2018_idioms = { level = "warn", priority = -1 } # e.g. Formatter<'_> instead of Formatter

[lints.clippy]
# Groups first, at lower priority, so the individual settings below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors; every intentional panic states its reason.
unwrap_used = "warn"                     # use ?, or expect("why this cannot fail")
expect_used = "allow"                    # expect with a reason is the sanctioned form
panic_in_result_fn = "warn"              # a fn returning Result does not also panic
missing_errors_doc = "warn"              # [lib] document failures under # Errors
missing_panics_doc = "warn"              # [lib] document reachable panics under # Panics

# Suppressions explain themselves and expire when no longer needed.
allow_attributes = "warn"                # prefer #[expect] over #[allow] (rust-version 1.81+)
allow_attributes_without_reason = "warn" # every suppression says why (rust-version 1.81+)

# Unsafe is justified, one operation at a time.
undocumented_unsafe_blocks = "warn"      # // SAFETY: comment on every unsafe block
multiple_unsafe_ops_per_block = "warn"   # one unsafe operation per block

# API shape.
fn_params_excessive_bools = "warn"       # with clippy.toml max-fn-params-bools = 0: no bool parameters
struct_excessive_bools = "warn"          # many bool fields: an enum or bitflags
clone_on_ref_ptr = "warn"                # write Rc::clone(&x) so cheap clones stay visible
redundant_clone = "warn"                 # a clone whose original is never used again

# Idioms.
string_add = "warn"                      # build strings with format! or push_str, not +
wildcard_imports = "warn"                # no glob imports (use super::* in tests is allowed)

# Leftovers that never ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"                    # [lib] libraries log, they do not print
print_stderr = "warn"                    # [lib] libraries log, they do not print
exit = "warn"                            # [lib] libraries return errors, they do not exit
mem_forget = "warn"                      # leaks are deliberate and visible, or absent

# Casts that silently lose information.
as_conversions = "warn"                  # prefer From / TryFrom
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are noise in practice, or that rust-idioms.md disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"               # a leaf module named after its main item is fine
enum_glob_use = "allow"                  # use Enum::* inside a function that matches on it
